name: Generate Games (Self-Play)

on:
  workflow_dispatch:
    inputs:
      num_games:
        description: 'Number of games to generate'
        required: true
        default: '1000'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install python-chess
        sudo apt-get update
        sudo apt-get install -y cmake g++ make

    - name: Build Engine (Linux)
      run: |
        mkdir build
        cd build
        cmake ..
        make -j2
        mv IronRook ../IronRook
        chmod +x ../IronRook

    - name: Run Self-Play
      run: |
        python tools/selfplay.py ./IronRook games.pgn ${{ github.event.inputs.num_games }}

    - name: Upload Games PGN
      uses: actions/upload-artifact@v3
      with:
        name: games-pgn
        path: games.pgn
